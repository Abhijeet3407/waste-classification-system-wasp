version: '3.8'

services:
  waste-classifier:
    build: .
    container_name: waste-classification-api
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./results:/app/results
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add TensorBoard for monitoring
  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: waste-classifier-tensorboard
    ports:
      - "6006:6006"
    volumes:
      - ./logs:/logs
    command: tensorboard --logdir=/logs --host=0.0.0.0
    restart: unless-stopped

volumes:
  data:
  models:
  uploads:
  logs:
  results:
